[package]
name = "mcp-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmcp = { version = "3.1.2", features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "0.8"
